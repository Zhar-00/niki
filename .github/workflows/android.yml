name: Build Native Standalone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Ninja 
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Compilar APK Independiente
        id: compile
        run: |
          cd builds/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info > build_log.txt 2>&1

      - name: Extraer error exacto (si falla)
        if: failure()
        run: |
          echo "==== DETALLE DEL ERROR DE COMPILACIÓN ===="
          tail -n 100 builds/android/build_log.txt
          
      - name: Subir registro de error (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ERROR-LOG
          path: builds/android/build_log.txt

      - name: Subir tu APK listo (si tuvo éxito)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mikoto-Nikki-Standalone
          path: builds/android/app/build/outputs/apk/debug/*.apk
          
