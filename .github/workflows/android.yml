name: Build Native Standalone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK y NDK
        uses: android-actions/setup-android@v3
        
      - name: Instalar dependencias de compilación
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Compilar APK Independiente
        run: |
          cd builds/android
          chmod +x gradlew
          # Ejecutar Gradle asegurando que use la estructura de assets para standalone
          ./gradlew assembleDebug --info

      - name: Subir tu juego listo
        uses: actions/upload-artifact@v4
        with:
          name: Mikoto-Nikki-Standalone
          path: builds/android/app/build/outputs/apk/debug/*.apk
          
