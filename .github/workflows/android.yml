name: Build Native Standalone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v5 # <-- Actualizado para evitar bloqueos
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Ninja 
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Compilar APK Independiente
        run: |
          cd builds/android
          chmod +x gradlew
          # Ejecutar con bandera --no-build-cache para forzar descargas limpias
          ./gradlew assembleDebug --no-build-cache --stacktrace --info
          
      - name: Subir tu juego listo
        uses: actions/upload-artifact@v4
        with:
          name: Mikoto-Nikki-Standalone
          path: builds/android/app/build/outputs/apk/debug/*.apk
