name: Build Native Standalone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar librerías C++ de Android
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Compilar juego independiente
        run: |
          cd builds/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
      - name: Subir tu juego listo
        uses: actions/upload-artifact@v4
        with:
          name: Mikoto-Nikki-Standalone
          path: builds/android/app/build/outputs/apk/debug/*.apk
          
