name: Build Android APK (Repackage)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar tus archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar herramientas y APK Base
        run: |
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          
          echo "Descargando base directamente de F-Droid..."
          # Reemplaza la URL de abajo con el enlace que copiaste si es distinto
          wget "https://f-droid.org/repo/org.easyrpg.player_6699.apk" -O base.apk

      - name: Inyectar el juego en el APK
        run: |
          java -jar apktool.jar d base.apk -o decoded
          mkdir -p decoded/assets
          cp -r builds/android/app/src/main/assets/* decoded/assets/
          java -jar apktool.jar b decoded -o unsigned.apk
          java -jar signer.jar -a unsigned.apk -o final_apk

      - name: Subir tu juego listo
        uses: actions/upload-artifact@v4
        with:
          name: Mikoto-Nikki-APK
          path: final_apk/*.apk
          
